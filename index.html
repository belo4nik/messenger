<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Workspace Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e15;
            --surface: rgba(30, 30, 35, 0.6);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --danger: #ff4b4b;
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }
        body { 
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            background: linear-gradient(-45deg, #0d0e15, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        #setup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .setup-card {
            background: rgba(25, 25, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px; border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
            width: 100%; max-width: 420px;
            text-align: center;
        }
        .setup-card h1 { 
            margin-top: 0; 
            background: -webkit-linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem; margin-bottom: 5px;
        }
        .setup-card p { color: #aaa; margin-bottom: 25px; }
        
        .input-group { position: relative; margin: 15px 0; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #888; }
        .input-field {
            width: 100%; padding: 14px 14px 14px 45px;
            border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3); color: var(--text); 
            box-sizing: border-box; font-size: 1rem; transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(0, 0, 0, 0.5);
        }
        .btn-primary {
            width: 100%; padding: 14px; 
            background: linear-gradient(45deg, #00d2ff, #3a7bd5); 
            color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            margin-top: 15px; font-size: 1.1rem; transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
        }
        .btn-primary:hover { box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); transform: scale(1.02); }
        .help-text { font-size: 0.85rem; color: #888; margin-top: 15px; }

        #main-screen { display: none; flex-direction: column; height: 100%; padding: 15px; box-sizing: border-box; gap: 15px; }
        
        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 16px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .room-info { 
            font-family: monospace; background: rgba(0,0,0,0.4); 
            padding: 6px 12px; border-radius: 8px; color: var(--primary); letter-spacing: 1px;
        }
        .icon-btn {
            background: none; border: none; color: var(--primary); 
            cursor: pointer; padding: 5px; margin-left: 8px; transition: 0.2s;
        }
        .icon-btn:hover { color: #fff; transform: scale(1.1); }
        
        .workspace { display: flex; flex: 1; gap: 15px; overflow: hidden; }
        
        .video-area { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        .video-grid {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px; overflow-y: auto; align-content: start; padding-right: 5px;
        }
        
        .video-wrapper {
            background: #000; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 16/9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
        }
        .video-wrapper h3 {
            position: absolute; bottom: 12px; left: 12px; margin: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; z-index: 10; border: 1px solid rgba(255,255,255,0.1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        video.mirror { transform: scaleX(-1); }

        .video-wrapper.fullscreen-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; border-radius: 0; border: none;
        }
        .fullscreen-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            color: white; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px 12px; cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .fullscreen-btn:hover { background: rgba(0,0,0,0.8); }

        .controls-bar {
            padding: 15px; display: flex; justify-content: center; align-items: center; gap: 20px;
            flex-wrap: wrap; flex-shrink: 0;
        }
        
        .control-group {
            display: flex; align-items: center; gap: 12px; 
            background: rgba(0,0,0,0.4); padding: 6px 15px 6px 6px; 
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.05);
        }
        
        .control-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .control-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .control-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }
        .control-btn.danger { background: var(--danger); color: white; }
        .control-btn.danger:hover { background: #ff6b6b; box-shadow: 0 0 15px rgba(255, 75, 75, 0.4); }

        .visualizer { display: flex; gap: 3px; height: 20px; align-items: center; opacity: 0.3; transition: 0.3s; }
        .visualizer.active { opacity: 1; }
        .visualizer .bar { width: 4px; background: var(--primary); border-radius: 2px; height: 4px; transition: height 0.05s ease; }

        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; width: 80px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 10px var(--primary-glow); }

        .chat-area { width: 320px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; text-align: center; letter-spacing: 1px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { 
            background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 12px; 
            max-width: 85%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; border: 1px solid rgba(255,255,255,0.05);
        }
        .msg.self { background: linear-gradient(45deg, #0f3460, #1a1a2e); border-color: rgba(0, 210, 255, 0.3); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; border-bottom-left-radius: 2px; }
        .sender-name { font-size: 0.75rem; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        
        .chat-input { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
        .chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.2s; }
        .chat-input input:focus { border-color: var(--primary); }
        .chat-input button { background: var(--primary); color: #000; border: none; width: 45px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .chat-input button:hover { transform: scale(1.05); box-shadow: 0 0 10px var(--primary-glow); }

        @media (max-width: 950px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .video-area { flex: none; height: auto; min-height: 50vh; overflow: visible; }
            .chat-area { width: 100%; flex: none; height: 400px; }
            .controls-bar { padding: 10px; gap: 10px; }
            .video-grid { padding-right: 0; }
        }
        @media (max-width: 500px) {
            .top-bar { flex-direction: column; gap: 10px; text-align: center; }
            .control-group { padding: 4px 10px 4px 4px; gap: 8px; }
            .control-btn { width: 42px; height: 42px; }
            input[type=range] { width: 60px; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="setup-screen">
        <div class="setup-card">
            <h1><i class="fas fa-satellite-dish"></i> P2P Pro</h1>
            <p>Децентрализованная сеть</p>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="input-field" placeholder="Как вас зовут?">
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="room-id" class="input-field" placeholder="Код комнаты (пусто = новая)">
            </div>
            
            <button class="btn-primary" onclick="joinRoom()">
                <i class="fas fa-sign-in-alt"></i> Войти в эфир
            </button>
            <div class="help-text">Комната живет, пока в ней есть участники.</div>
        </div>
    </div>
    
    <div id="main-screen">
        <div class="top-bar glass-panel">
            <div>
                <i class="fas fa-user-circle" style="color:var(--primary); margin-right:5px;"></i>
                <strong id="ui-username"></strong>
                <button class="icon-btn" onclick="changeName()" title="Изменить имя">
                    <i class="fas fa-pen"></i>
                </button>
            </div>
            <div>
                <span style="color:#aaa; font-size: 0.9rem;">Комната:</span> 
                <span class="room-info" id="ui-room-id">Загрузка...</span>
                <button class="icon-btn" onclick="copyInviteLink()" title="Скопировать ссылку">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>
        
        <div class="workspace">
            <div class="video-area">
                <div class="video-grid" id="video-grid">
                    <div class="video-wrapper">
                        <h3 id="local-video-title">Вы (Локально)</h3>
                        <button class="fullscreen-btn" onclick="this.parentElement.classList.toggle('fullscreen-mode')">
                            <i class="fas fa-expand"></i>
                        </button>
                        <video id="local-video" autoplay muted playsinline class="mirror"></video>
                    </div>
                </div>
                
                <div class="controls-bar glass-panel">
                    <div class="control-group">
                        <button class="control-btn danger" id="btn-mic" onclick="toggleMic()" title="Микрофон">
                            <i class="fas fa-microphone-slash"></i>
                        </button>
                        <div class="visualizer" id="audio-visualizer">
                            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        </div>
                    </div>
                    
                    <button class="control-btn danger" id="btn-cam" onclick="toggleCam()" title="Камера">
                        <i class="fas fa-video-slash"></i>
                    </button>
                    
                    <button class="control-btn" id="btn-screen" onclick="toggleScreen()" title="Демонстрация экрана">
                        <i class="fas fa-desktop"></i>
                    </button>

                    <div class="control-group">
                        <button class="control-btn active" id="btn-volume" onclick="toggleMute()" title="Входящий звук">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
                    </div>
                </div>
            </div>
            
            <div class="chat-area glass-panel">
                <div class="chat-header"><i class="far fa-comments"></i> Чат</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Написать..." onkeypress="if(event.key === 'Enter') sendChat()">
                    <button onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myPeerId = localStorage.getItem('my_p2p_id');
        if (!myPeerId) {
            myPeerId = 'user_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('my_p2p_id', myPeerId);
        }

        const peer = new Peer(myPeerId, {
            host: 'belo4nik-server.duckdns.org',
            secure: true,
            port: 443,
            path: '/myapp',
            config: {
                'iceServers': [
                    { urls: 'stun:belo4nik-server.duckdns.org:3478' },
                    {
                        urls: [
                            'turn:belo4nik-server.duckdns.org:3478',
                            'turn:belo4nik-server.duckdns.org:3478?transport=tcp'
                        ],
                        username: 'myuser', 
                        credential: 'superpassword123'
                    }
                ]
            }
        });
        
        let myName = localStorage.getItem('my_p2p_name') || "";
        let currentRoomId = null;
        let localStream = null;
        let screenStream = null;
        let micEnabled = false;
        let camEnabled = false;
        let isScreenSharing = false;
        const peers = {};

        let globalVolume = 1;
        let isMuted = false;
        let audioCtx, analyser, dataArray;
        let uiAudioContext = null;
        let lastUiSoundAt = 0;
        let wakeLock = null;

        if (myName) document.getElementById('username').value = myName;

        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) document.getElementById('room-id').value = roomFromUrl;

        peer.on('disconnected', () => {
            addSysMsg('Потеряна связь с сервером сигналов. Восстанавливаем...');
            peer.reconnect();
        });

        peer.on('error', (err) => {
            console.error('PeerJS Ошибка:', err);
            if (err.type === 'peer-unavailable') addSysMsg('Ошибка: Участник недоступен.');
        });

        function changeVolume(val) {
            globalVolume = parseFloat(val);
            isMuted = globalVolume === 0;
            updateVolumeUI();
            applyVolumeToAll();
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                document.getElementById('volume-slider').value = 0;
            } else {
                if (globalVolume === 0) globalVolume = 1;
                document.getElementById('volume-slider').value = globalVolume;
            }
            updateVolumeUI();
            applyVolumeToAll();
        }

        function updateVolumeUI() {
            const btn = document.getElementById('btn-volume');
            if (isMuted || globalVolume === 0) {
                btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                btn.className = 'control-btn danger';
            } else {
                btn.innerHTML = globalVolume < 0.5 ? '<i class="fas fa-volume-down"></i>' : '<i class="fas fa-volume-up"></i>';
                btn.className = 'control-btn active';
            }
        }

        function applyVolumeToAll() {
            const actualVol = isMuted ? 0 : globalVolume;
            Object.values(peers).forEach(p => {
                if (p.videoWrapper) {
                    const vid = p.videoWrapper.querySelector('video');
                    if (vid) vid.volume = actualVol;
                }
            });
        }

        function playUiSound(kind = 'click') {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!uiAudioContext) uiAudioContext = new AudioContextClass();
                if (uiAudioContext.state === 'suspended') uiAudioContext.resume().catch(() => {});
                if (kind === 'click' && Date.now() - lastUiSoundAt < 45) return;
                lastUiSoundAt = Date.now();
                const now = uiAudioContext.currentTime;
                const oscillator = uiAudioContext.createOscillator();
                const gain = uiAudioContext.createGain();
                oscillator.connect(gain);
                gain.connect(uiAudioContext.destination);
                const isMessage = kind === 'message';
                const duration = isMessage ? 0.14 : 0.055;
                oscillator.type = isMessage ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(isMessage ? 880 : 620, now);
                oscillator.frequency.exponentialRampToValueAtTime(isMessage ? 1175 : 480, now + duration);
                
                const targetGain = isMessage ? 0.04 : 0.02;
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(targetGain, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                oscillator.start(now);
                oscillator.stop(now + duration + 0.01);
            } catch (err) {}
        }

        document.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button || button.disabled || button.matches('.chat-input button')) return;
            playUiSound('click');
        });

        async function initMedia() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) {}

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
                try {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                    videoStream.getVideoTracks().forEach(track => {
                        track.enabled = false;
                        localStream.addTrack(track);
                    });
                } catch (cameraError) {
                    console.warn("Камера недоступна");
                }

                document.getElementById('local-video').srcObject = localStream;
                initVisualizer(localStream);
                return true;
            } catch (err) {
                alert(`Не удалось получить микрофон: ${err.message}`);
                return false;
            }
        }

        function initVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bars = document.querySelectorAll('.visualizer .bar');
            if (!micEnabled) {
                bars.forEach(bar => bar.style.height = '4px');
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            const step = Math.floor(dataArray.length / 10);
            for (let i = 0; i < 5; i++) {
                const value = dataArray[i * step];
                bars[i].style.height = Math.max(4, (value / 255) * 20) + 'px';
            }
        }

        async function joinRoom() {
            const nameInput = document.getElementById('username').value.trim();
            let roomInput = document.getElementById('room-id').value.trim();
            if (!nameInput) return alert('Пожалуйста, введите ваше имя!');
            
            myName = nameInput;
            localStorage.setItem('my_p2p_name', myName); 
            
            if (!(await initMedia())) return;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('ui-username').innerText = myName;

            // Генерируем случайный ID комнаты, если поле пустое
            currentRoomId = roomInput || Math.random().toString(36).substr(2, 6);
            document.getElementById('ui-room-id').innerText = currentRoomId;
            window.history.replaceState({}, document.title, window.location.pathname + '?room=' + currentRoomId);
            
            addSysMsg(roomInput ? 'Подключение к комнате...' : 'Комната создана!');

            // Делаем HTTP запрос к нашему новому API для регистрации в комнате
            try {
                const response = await fetch(`https://belo4nik-server.duckdns.org/myapp/api/room/${currentRoomId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peerId: myPeerId })
                });
                const data = await response.json();
                
                // Сервер вернул массив ID участников, которые уже в комнате. Звоним им всем!
                if (data.peers && data.peers.length > 0) {
                    addSysMsg(`В комнате уже есть участники. Соединяемся...`);
                    data.peers.forEach(targetId => {
                        connectToPeer(targetId, "Ожидание...");
                    });
                } else {
                    addSysMsg('Вы первый в этой комнате. Отправьте ссылку коллегам!');
                }
            } catch (err) {
                console.error("Ошибка API комнат:", err);
                addSysMsg('⚠️ Ошибка синхронизации с сервером комнат.');
            }
        }

        function changeName() {
            const newName = prompt("Введите новое имя:", myName);
            if (newName && newName.trim() !== "" && newName !== myName) {
                myName = newName.trim();
                localStorage.setItem('my_p2p_name', myName);
                document.getElementById('ui-username').innerText = myName;
                Object.values(peers).forEach(p => {
                    if (p.conn && p.conn.open) p.conn.send({ type: 'name_change', name: myName });
                });
                addSysMsg(`Имя изменено на ${myName}.`);
            }
        }

        // Обработка входящих соединений
        peer.on('connection', (conn) => {
            const remoteName = conn.metadata?.name || 'Аноним';
            const id = conn.peer;
            if (peers[id]) removePeer(id);

            conn.on('open', () => {
                setupConnectionData(conn, remoteName);
                // Отправляем свое имя новичку в ответ
                conn.send({ type: 'name_change', name: myName });
            });
        });

        // Инициация соединения (когда мы подключаемся к существующим участникам)
        function connectToPeer(targetId, targetName = "Ожидание...") {
            if (targetId === peer.id) return; 
            if (peers[targetId] && peers[targetId].conn && peers[targetId].conn.open) return;

            const conn = peer.connect(targetId, { metadata: { name: myName } });
            if (localStream) {
                const call = peer.call(targetId, localStream, { metadata: { name: myName } });
                handleCall(call, targetName);
            }
            conn.on('open', () => { 
                setupConnectionData(conn, targetName); 
            });
        }

        function setupConnectionData(conn, remoteName) {
            const id = conn.peer;
            if (!peers[id]) peers[id] = { name: remoteName };
            peers[id].conn = conn;
            peers[id].name = remoteName;
            
            addSysMsg(`${remoteName} на связи.`);

            conn.peerConnection.addEventListener('iceconnectionstatechange', () => {
                const state = conn.peerConnection.iceConnectionState;
                if (state === 'connected') addSysMsg(`✅ P2P с ${peers[id].name} установлен`);
                if (state === 'failed') addSysMsg(`❌ Связь с ${peers[id].name} потеряна`);
            });

            conn.on('data', (data) => {
                if (typeof data === 'object') {
                    if (data.type === 'name_change') {
                        const oldName = peers[id].name;
                        peers[id].name = data.name;
                        if (peers[id].videoWrapper) {
                            peers[id].videoWrapper.querySelector('h3').innerText = data.name;
                        }
                        if (oldName !== "Ожидание...") addSysMsg(`${oldName} теперь ${data.name}.`);
                    }
                } else {
                    addChatMsg(peers[id].name, data, 'other');
                }
            });

            conn.on('close', () => removePeer(id));
            conn.on('error', () => removePeer(id));
        }

        peer.on('call', (call) => {
            const remoteName = call.metadata?.name || 'Аноним';
            const id = call.peer;
            if (peers[id] && peers[id].call) {
                if (peers[id].videoWrapper) peers[id].videoWrapper.remove();
            }
            call.answer(localStream);
            handleCall(call, remoteName);
        });

        function handleCall(call, name) {
            const id = call.peer;
            if (!peers[id]) peers[id] = { name: name };
            peers[id].call = call;
            
            call.on('stream', (remoteStream) => {
                if (peers[id].videoWrapper) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';
                wrapper.innerHTML = `
                    <h3>${peers[id].name}</h3>
                    <button class="fullscreen-btn" onclick="this.parentElement.classList.toggle('fullscreen-mode')">
                        <i class="fas fa-expand"></i>
                    </button>
                    <video playsinline></video>
                `;
                
                const videoEl = wrapper.querySelector('video');
                videoEl.srcObject = remoteStream;
                videoEl.volume = isMuted ? 0 : globalVolume;

                document.getElementById('video-grid').appendChild(wrapper);
                peers[id].videoWrapper = wrapper;

                videoEl.play().catch(e => console.log("Автоплей заблокирован", e));
            });

            call.on('close', () => removePeer(id));
            call.on('error', () => removePeer(id));
        }

        function removePeer(id) {
            if (peers[id]) {
                if (peers[id].videoWrapper) peers[id].videoWrapper.remove();
                if (peers[id].conn) peers[id].conn.close();
                if (peers[id].call) peers[id].call.close();
                addSysMsg(`${peers[id].name} вышел(ла).`);
                delete peers[id];
            }
        }

        function toggleMic() {
            micEnabled = !micEnabled;
            localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
            const btn = document.getElementById('btn-mic');
            const vis = document.getElementById('audio-visualizer');
            
            btn.className = micEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = micEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
            
            if (micEnabled) {
                vis.classList.add('active');
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                vis.classList.remove('active');
            }
        }

        function toggleCam() {
            camEnabled = !camEnabled;
            localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
            const btn = document.getElementById('btn-cam');
            btn.className = camEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = camEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        async function toggleScreen() {
            const btn = document.getElementById('btn-screen');
            if (!isScreenSharing) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    Object.values(peers).forEach(p => {
                        if (p.call && p.call.peerConnection) {
                            const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) sender.replaceTrack(screenTrack);
                            else p.call.peerConnection.addTrack(screenTrack, localStream);
                        }
                    });
                    const localVideo = document.getElementById('local-video');
                    localVideo.srcObject = screenStream;
                    localVideo.classList.remove('mirror');
                    isScreenSharing = true;
                    btn.classList.add('active');
                    screenTrack.onended = stopScreenSharing;
                } catch (e) { console.error("Ошибка экрана", e); }
            } else { stopScreenSharing(); }
        }

        function stopScreenSharing() {
            const camTrack = localStream.getVideoTracks()[0];
            Object.values(peers).forEach(p => {
                if (p.call && p.call.peerConnection) {
                    const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        if (camTrack) sender.replaceTrack(camTrack);
                        else p.call.peerConnection.removeTrack(sender);
                    }
                }
            });
            const localVideo = document.getElementById('local-video');
            localVideo.srcObject = localStream;
            localVideo.classList.add('mirror');
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            isScreenSharing = false;
            document.getElementById('btn-screen').classList.remove('active');
        }

        function sendChat() {
            playUiSound('click');
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            Object.values(peers).forEach(p => {
                if (p.conn && p.conn.open) p.conn.send(msg);
            });
            addChatMsg(myName, msg, 'self');
            input.value = '';
        }

        function addChatMsg(sender, msg, type) {
            if (type === 'other') playUiSound('message');
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="msg ${type}">${type === 'other' ? `<div class="sender-name">${sender}</div>` : ''}${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function addSysMsg(msg) {
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div style="text-align:center; color:rgba(255,255,255,0.4); font-size:0.8rem; margin:5px 0;">${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function copyInviteLink() {
            const url = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
            navigator.clipboard.writeText(url);
            addSysMsg("Ссылка скопирована!");
        }
    </script>
</body>
