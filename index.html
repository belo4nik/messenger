<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Workspace Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --danger: #cf6679;
            --text: #e0e0e0;
            --border: #333;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        
        #setup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .setup-card {
            background: var(--surface); padding: 40px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px;
            text-align: center;
        }
        .setup-card h1 { margin-top: 0; color: var(--primary); }
        .input-field {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: 1px solid var(--border);
            background: #2d2d2d; color: var(--text); box-sizing: border-box;
        }
        .btn-primary {
            width: 100%; padding: 12px; background: var(--primary); color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            margin-top: 15px; font-size: 1rem;
        }
        .btn-primary:hover { opacity: 0.9; }
        .help-text { font-size: 0.85rem; color: #888; margin-top: 10px; }

        #main-screen { display: none; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 10px 20px; border-radius: 12px;
            margin-bottom: 15px;
        }
        .room-info { font-family: monospace; background: #2d2d2d; padding: 5px 10px; border-radius: 5px; color: var(--primary); }
        
        .workspace { display: flex; flex: 1; gap: 20px; overflow: hidden; }
        
        .video-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .video-grid {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; overflow-y: auto; align-content: start;
        }
        
        .video-wrapper {
            background: #000; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9;
        }
        .video-wrapper h3 {
            position: absolute; bottom: 10px; left: 10px; margin: 0;
            background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 6px;
            font-size: 0.9rem; z-index: 10;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        video.mirror { transform: scaleX(-1); }

        /* Полноэкранный режим */
        .video-wrapper.fullscreen-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; border-radius: 0;
        }
        .fullscreen-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: white; border: none;
            border-radius: 6px; padding: 8px 12px; cursor: pointer; z-index: 10;
        }

        .controls-bar {
            background: var(--surface); padding: 15px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; gap: 20px;
        }
        
        .mic-group {
            display: flex; align-items: center; gap: 15px; background: #2d2d2d; padding: 5px 15px 5px 5px; border-radius: 30px;
        }
        
        .control-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: #444; color: white; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .control-btn:hover { background: #555; }
        .control-btn.active { background: var(--primary); color: #000; }
        .control-btn.danger { background: var(--danger); }

        .visualizer {
            display: flex; gap: 3px; height: 25px; align-items: center; opacity: 0.3; transition: opacity 0.3s;
        }
        .visualizer.active { opacity: 1; }
        .visualizer .bar {
            width: 5px; background: var(--primary); border-radius: 3px; height: 4px; transition: height 0.05s ease;
        }

        .chat-area {
            width: 350px; background: var(--surface); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; text-align: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2d2d2d; padding: 10px; border-radius: 10px; max-width: 85%; word-wrap: break-word; }
        .msg.self { background: var(--primary); color: #000; align-self: flex-end; }
        .msg.other { align-self: flex-start; }
        .sender-name { font-size: 0.75rem; opacity: 0.7; margin-bottom: 4px; }
        .chat-input { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #2d2d2d; color: white; }
        .chat-input button { background: var(--primary); border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="setup-screen">
        <div class="setup-card">
            <h1>P2P Workspace</h1>
            <p>Присоединяйтесь к комнате или создайте свою</p>
            <input type="text" id="username" class="input-field" placeholder="Ваше имя (обязательно)">
            <input type="text" id="host-id" class="input-field" placeholder="ID организатора (оставьте пустым для создания)">
            <button class="btn-primary" onclick="joinRoom()">Войти в комнату</button>
            <div class="help-text">Мы запросим доступ к камере, но по умолчанию она будет выключена.</div>
        </div>
    </div>
    
    <div id="main-screen">
        <div class="top-bar">
            <div>
                <strong>Ваше имя:</strong> <span id="ui-username"></span>
                <button onclick="changeName()" style="background:none;border:none;color:var(--primary);cursor:pointer;margin-left:5px;" title="Изменить имя">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
            <div>
                <strong>Код комнаты:</strong> 
                <span class="room-info" id="ui-room-id">Загрузка...</span>
                <button onclick="copyInviteLink()" style="background:none;border:none;color:var(--primary);cursor:pointer;margin-left:5px;" title="Скопировать ссылку-приглашение">
                    <i class="fas fa-link"></i> Ссылка
                </button>
            </div>
        </div>
        <div class="workspace">
            <div class="video-area">
                <div class="video-grid" id="video-grid">
                    <div class="video-wrapper">
                        <h3 id="local-video-title">Вы (Локально)</h3>
                        <button class="fullscreen-btn" onclick="this.parentElement.classList.toggle('fullscreen-mode')">
                            <i class="fas fa-expand"></i>
                        </button>
                        <video id="local-video" autoplay muted playsinline class="mirror"></video>
                    </div>
                </div>
                <div class="controls-bar">
                    <div class="mic-group">
                        <button class="control-btn danger" id="btn-mic" onclick="toggleMic()" title="Микрофон">
                            <i class="fas fa-microphone-slash"></i>
                        </button>
                        <div class="visualizer" id="audio-visualizer">
                            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        </div>
                    </div>
                    <button class="control-btn danger" id="btn-cam" onclick="toggleCam()" title="Камера">
                        <i class="fas fa-video-slash"></i>
                    </button>
                    <button class="control-btn" id="btn-screen" onclick="toggleScreen()" title="Демонстрация экрана">
                        <i class="fas fa-desktop"></i>
                    </button>
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-header">Чат комнаты</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="if(event.key === 'Enter') sendChat()">
                    <button onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Инициализация постоянного ID
        let myPeerId = localStorage.getItem('my_p2p_id');
        if (!myPeerId) {
            myPeerId = 'user_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('my_p2p_id', myPeerId);
        }

        const peer = new Peer(myPeerId, {
            host: 'belo4nik-server.duckdns.org',
            secure: true,
            port: 443,
            path: '/myapp',
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });
        
        let myName = localStorage.getItem('my_p2p_name') || "Гость";
        let isHost = false;
        let actualHostId = null;
        let localStream = null;
        let screenStream = null;
        let micEnabled = false;
        let camEnabled = false;
        let isScreenSharing = false;
        const peers = {};

        let audioCtx, analyser, dataArray;
        let uiAudioContext = null;
        let lastUiSoundAt = 0;
        let wakeLock = null; // Для запрета засыпания экрана

        // Автозаполнение имени из кеша
        if (localStorage.getItem('my_p2p_name')) {
            document.getElementById('username').value = localStorage.getItem('my_p2p_name');
        }

        // Автозаполнение ID комнаты
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) {
            document.getElementById('host-id').value = roomFromUrl;
        }

        peer.on('disconnected', () => {
            console.log('Связь с сервером потеряна. Переподключение...');
            addSysMsg('Потеряна связь с сервером сигналов. Восстанавливаем...');
            peer.reconnect();
        });

        peer.on('error', (err) => {
            console.error('PeerJS Ошибка:', err);
            if (err.type === 'peer-unavailable') {
                addSysMsg('Ошибка: Собеседник недоступен или уже отключился.');
            }
        });

        function playUiSound(kind = 'click') {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;

                if (!uiAudioContext) uiAudioContext = new AudioContextClass();
                if (uiAudioContext.state === 'suspended') uiAudioContext.resume().catch(() => {});

                if (kind === 'click' && Date.now() - lastUiSoundAt < 45) return;
                lastUiSoundAt = Date.now();

                const now = uiAudioContext.currentTime;
                const oscillator = uiAudioContext.createOscillator();
                const gain = uiAudioContext.createGain();
                oscillator.connect(gain);
                gain.connect(uiAudioContext.destination);

                const isMessage = kind === 'message';
                const duration = isMessage ? 0.14 : 0.055;
                oscillator.type = isMessage ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(isMessage ? 880 : 620, now);
                oscillator.frequency.exponentialRampToValueAtTime(isMessage ? 1175 : 480, now + duration);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(isMessage ? 0.075 : 0.035, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                oscillator.start(now);
                oscillator.stop(now + duration + 0.01);
            } catch (err) {}
        }

        document.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button || button.disabled || button.matches('.chat-input button')) return;
            playUiSound('click');
        });

        async function initMedia() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Экран не погаснет');
                }
            } catch (err) {
                console.warn('Wake Lock не поддерживается', err);
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });

                try {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                    videoStream.getVideoTracks().forEach(track => {
                        track.enabled = false;
                        localStream.addTrack(track);
                    });
                } catch (cameraError) {
                    console.warn("Камера недоступна:", cameraError.message);
                }

                document.getElementById('local-video').srcObject = localStream;
                console.log('[LOCAL MEDIA READY]', localStream.getTracks().map(track => ({ kind: track.kind, enabled: track.enabled, readyState: track.readyState })));
                if (!localStream.getVideoTracks().length) {
                    addSysMsg('Камера не обнаружена: собеседники не получат видео с этого устройства.');
                }
                initVisualizer(localStream);
                return true;
            } catch (err) {
                alert(`Не удалось получить микрофон: ${err.message}`);
                return false;
            }
        }

        function initVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bars = document.querySelectorAll('.visualizer .bar');
            if (!micEnabled) {
                bars.forEach(bar => bar.style.height = '4px');
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            const step = Math.floor(dataArray.length / 10);
            for (let i = 0; i < 5; i++) {
                const value = dataArray[i * step];
                bars[i].style.height = Math.max(4, (value / 255) * 25) + 'px';
            }
        }

        async function joinRoom() {
            const nameInput = document.getElementById('username').value.trim();
            let hostInput = document.getElementById('host-id').value.trim();
            if (!nameInput) return alert('Пожалуйста, введите ваше имя!');
            
            myName = nameInput;
            localStorage.setItem('my_p2p_name', myName); 
            
            if (!(await initMedia())) return;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('ui-username').innerText = myName;

            if (!hostInput) {
                isHost = true;
                actualHostId = peer.id;
                document.getElementById('ui-room-id').innerText = peer.id;
                addSysMsg('Вы создали комнату. Скопируйте ссылку-приглашение выше и отправьте участникам.');
            } else {
                isHost = false;
                actualHostId = hostInput;
                document.getElementById('ui-room-id').innerText = hostInput;
                connectToPeer(hostInput);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function changeName() {
            const newName = prompt("Введите новое имя:", myName);
            if (newName && newName.trim() !== "" && newName !== myName) {
                const oldName = myName;
                myName = newName.trim();
                localStorage.setItem('my_p2p_name', myName);
                document.getElementById('ui-username').innerText = myName;
                
                Object.values(peers).forEach(p => {
                    if (p.conn && p.conn.open) p.conn.send({ type: 'name_change', name: myName });
                });
                addSysMsg(`Вы сменили имя на ${myName}.`);
            }
        }

        // У каждого участника отдельные ссылки на DataConnection и MediaConnection.
        // Медиазвонок для каждой пары инициирует только участник с меньшим ID.
        function getPeerData(id, name = 'Ожидание...') {
            if (!peers[id]) {
                peers[id] = { name, conn: null, call: null, videoWrapper: null };
            }
            if (name && (!peers[id].name || peers[id].name === 'Ожидание...')) {
                peers[id].name = name;
            }
            return peers[id];
        }

        function peerHasActiveCall(id) {
            const current = peers[id]?.call;
            return !!current && current.open !== false && current.peerConnection?.connectionState !== 'closed';
        }

        function ensureMediaCall(targetId, targetName = 'Ожидание...') {
            if (!localStream || !peer.open || targetId === peer.id) return;
            const data = getPeerData(targetId, targetName);

            // Не создаём второй звонок для той же пары. Ожидаем входящий,
            // если ID этого клиента лексикографически больше ID собеседника.
            if (peerHasActiveCall(targetId) || peer.id > targetId) return;

            console.log('[MEDIA OUTGOING]', targetId, localStream.getTracks().map(t => ({
                kind: t.kind, enabled: t.enabled, readyState: t.readyState
            })));
            const call = peer.call(targetId, localStream, { metadata: { name: myName } });
            if (!call) {
                console.error('[MEDIA CALL FAILED] Не удалось создать звонок:', targetId);
                return;
            }
            handleCall(call, data.name || targetName);
        }

        peer.on('connection', (conn) => {
            const id = conn.peer;
            const remoteName = conn.metadata?.name || peers[id]?.name || 'Аноним';
            const data = getPeerData(id, remoteName);

            // Не удаляем участника при открытии DataConnection: у него уже
            // может быть активный MediaConnection.
            conn.on('open', () => {
                setupConnectionData(conn, remoteName);
                if (isHost) {
                    const existingPeers = Object.keys(peers)
                        .filter(pId => pId !== id)
                        .map(pId => ({ id: pId, name: peers[pId].name }));
                    conn.send({ type: 'room_state', peers: existingPeers });
                }
                ensureMediaCall(id, remoteName);
            });
        });

        function connectToPeer(targetId, targetName = 'Ожидание...') {
            if (!targetId || targetId === peer.id) return;
            const data = getPeerData(targetId, targetName);

            if (data.conn?.open) {
                ensureMediaCall(targetId, targetName);
                return;
            }

            // Не создаём повторный DataConnection, если предыдущий ещё открывается.
            if (data.conn && data.conn.open === false && data.conn.peerConnection?.connectionState !== 'closed') {
                return;
            }

            const conn = peer.connect(targetId, { metadata: { name: myName } });
            data.conn = conn;
            conn.on('open', () => {
                setupConnectionData(conn, targetName);
                ensureMediaCall(targetId, targetName);
            });
            conn.on('error', err => {
                console.error('[DATA CONNECTION ERROR]', targetId, err);
            });
        }

        function setupConnectionData(conn, remoteName) {
            const id = conn.peer;
            const data = getPeerData(id, remoteName);
            data.conn = conn;
            data.name = remoteName || data.name;

            if (!conn.__messengerHandlersAttached) {
                conn.__messengerHandlersAttached = true;
                addSysMsg(`${data.name} присоединился(ась).`);

                if (conn.peerConnection) {
                    conn.peerConnection.addEventListener('iceconnectionstatechange', () => {
                        const state = conn.peerConnection.iceConnectionState;
                        if (state === 'connected' || state === 'completed') addSysMsg(`Канал данных с ${data.name} установлен`);
                        if (state === 'disconnected') addSysMsg(`Связь данных с ${data.name} нестабильна`);
                        if (state === 'failed') addSysMsg(`Канал данных с ${data.name} не установлен`);
                    });
                }

                conn.on('data', (message) => {
                    if (typeof message === 'object' && message !== null) {
                        if (message.type === 'room_state' && !isHost && Array.isArray(message.peers)) {
                            message.peers.forEach(person => connectToPeer(person.id, person.name));
                        } else if (message.type === 'name_change') {
                            const oldName = data.name;
                            data.name = message.name;
                            if (data.videoWrapper) {
                                const title = data.videoWrapper.querySelector('h3');
                                if (title) title.textContent = message.name;
                            }
                            addSysMsg(`${oldName} теперь ${message.name}.`);
                        }
                    } else {
                        addChatMsg(data.name, String(message), 'other');
                    }
                });

                conn.on('close', () => {
                    if (peers[id]?.conn === conn) peers[id].conn = null;
                    // Закрытие чата не должно само по себе убивать медиазвонок.
                    if (peers[id] && !peers[id].call && !peers[id].videoWrapper) {
                        delete peers[id];
                    }
                });
            }
        }

        peer.on('call', (call) => {
            const id = call.peer;
            const remoteName = call.metadata?.name || peers[id]?.name || 'Аноним';
            const data = getPeerData(id, remoteName);

            // При дубликате оставляем уже работающий звонок.
            if (peerHasActiveCall(id) && data.call !== call) {
                console.warn('[MEDIA DUPLICATE] Закрываю повторный звонок от', id);
                call.close();
                return;
            }
            if (!localStream) {
                console.error('[MEDIA ANSWER FAILED] Локальный медиапоток ещё не создан:', id);
                call.close();
                return;
            }

            console.log('[MEDIA INCOMING]', id, localStream.getTracks().map(t => ({
                kind: t.kind, enabled: t.enabled, readyState: t.readyState
            })));
            call.answer(localStream);
            handleCall(call, remoteName);
        });

        function handleCall(call, name) {
            const id = call.peer;
            const data = getPeerData(id, name);
            data.name = name || data.name;
            data.call = call;

            const pc = call.peerConnection;
            if (pc && !call.__diagnosticsAttached) {
                call.__diagnosticsAttached = true;
                const logState = label => console.log(`[MEDIA ${label}] ${data.name}:`, pc.iceConnectionState, pc.connectionState);
                pc.addEventListener('iceconnectionstatechange', () => logState('ICE'));
                pc.addEventListener('connectionstatechange', () => logState('CONNECTION'));
                pc.addEventListener('track', event => {
                    console.log('[MEDIA TRACK EVENT]', data.name, event.track.kind, event.track.readyState);
                });
            }

            call.on('stream', (remoteStream) => {
                if (data.call !== call) return; // старый звонок уже заменён
                console.log('[MEDIA STREAM]', data.name, {
                    audio: remoteStream.getAudioTracks().map(t => ({ enabled: t.enabled, muted: t.muted, state: t.readyState })),
                    video: remoteStream.getVideoTracks().map(t => ({ enabled: t.enabled, muted: t.muted, state: t.readyState }))
                });

                if (data.videoWrapper) {
                    const oldVideo = data.videoWrapper.querySelector('video');
                    if (oldVideo) oldVideo.srcObject = null;
                    data.videoWrapper.remove();
                    data.videoWrapper = null;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';
                const title = document.createElement('h3');
                title.textContent = data.name;
                const fullScreenButton = document.createElement('button');
                fullScreenButton.className = 'fullscreen-btn';
                fullScreenButton.innerHTML = '<i class="fas fa-expand"></i>';
                fullScreenButton.onclick = () => wrapper.classList.toggle('fullscreen-mode');
                const videoEl = document.createElement('video');
                videoEl.autoplay = true;
                videoEl.playsInline = true;
                videoEl.setAttribute('playsinline', '');
                videoEl.setAttribute('autoplay', '');
                videoEl.srcObject = remoteStream;

                wrapper.append(title, fullScreenButton, videoEl);
                document.getElementById('video-grid').appendChild(wrapper);
                data.videoWrapper = wrapper;

                const playRemote = () => videoEl.play().then(() => {
                    console.log('[MEDIA PLAY OK]', data.name);
                }).catch(err => {
                    console.warn('[MEDIA PLAY ERROR]', data.name, err.name, err.message);
                });
                playRemote();
                videoEl.addEventListener('loadedmetadata', playRemote, { once: true });
            });

            call.on('close', () => {
                if (data.call !== call) return;
                data.call = null;
                if (data.videoWrapper) {
                    const videoEl = data.videoWrapper.querySelector('video');
                    if (videoEl) videoEl.srcObject = null;
                    data.videoWrapper.remove();
                    data.videoWrapper = null;
                }
                if (!data.conn) delete peers[id];
                console.log('[MEDIA CLOSED]', data.name);
            });

            call.on('error', err => {
                console.error('[MEDIA ERROR]', data.name, err);
            });
        }

        function removePeer(id) {
            const data = peers[id];
            if (!data) return;
            if (data.videoWrapper) {
                const videoEl = data.videoWrapper.querySelector('video');
                if (videoEl) videoEl.srcObject = null;
                data.videoWrapper.remove();
            }
            if (data.conn) {
                const conn = data.conn;
                data.conn = null;
                conn.close();
            }
            if (data.call) {
                const call = data.call;
                data.call = null;
                call.close();
            }
            addSysMsg(`${data.name} покинул(а) комнату.`);
            delete peers[id];
        }

        function toggleMic() {
            micEnabled = !micEnabled;
            localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
            const btn = document.getElementById('btn-mic');
            const vis = document.getElementById('audio-visualizer');
            
            btn.className = micEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = micEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
            
            if (micEnabled) {
                vis.classList.add('active');
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                vis.classList.remove('active');
            }
        }

        function toggleCam() {
            camEnabled = !camEnabled;
            localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
            const btn = document.getElementById('btn-cam');
            btn.className = camEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = camEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        async function toggleScreen() {
            const btn = document.getElementById('btn-screen');
            if (!isScreenSharing) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    Object.values(peers).forEach(p => {
                        if (p.call && p.call.peerConnection) {
                            const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) {
                                sender.replaceTrack(screenTrack);
                            } else {
                                p.call.peerConnection.addTrack(screenTrack, localStream);
                            }
                        }
                    });
                    const localVideo = document.getElementById('local-video');
                    localVideo.srcObject = screenStream;
                    localVideo.classList.remove('mirror');
                    isScreenSharing = true;
                    btn.classList.add('active');
                    screenTrack.onended = stopScreenSharing;
                } catch (e) { console.error("Ошибка демонстрации экрана", e); }
            } else { stopScreenSharing(); }
        }

        function stopScreenSharing() {
            const camTrack = localStream.getVideoTracks()[0];
            Object.values(peers).forEach(p => {
                if (p.call && p.call.peerConnection) {
                    const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        if (camTrack) {
                            sender.replaceTrack(camTrack);
                        } else {
                            p.call.peerConnection.removeTrack(sender);
                        }
                    }
                }
            });
            const localVideo = document.getElementById('local-video');
            localVideo.srcObject = localStream;
            localVideo.classList.add('mirror');
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            isScreenSharing = false;
            document.getElementById('btn-screen').classList.remove('active');
        }

        function sendChat() {
            playUiSound('click');
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            Object.values(peers).forEach(p => {
                if (p.conn && p.conn.open) p.conn.send(msg);
            });
            addChatMsg(myName, msg, 'self');
            input.value = '';
        }

        function addChatMsg(sender, msg, type) {
            if (type === 'other') playUiSound('message');
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="msg ${type}">${type === 'other' ? `<div class="sender-name">${sender}</div>` : ''}${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function addSysMsg(msg) {
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div style="text-align:center; color:#888; font-size:0.8rem; margin:5px 0;">${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function copyInviteLink() {
            const url = window.location.origin + window.location.pathname + '?room=' + actualHostId;
            navigator.clipboard.writeText(url);
            addSysMsg("Ссылка-приглашение скопирована! Отправьте её коллегам.");
        }
    </script>
</body>
</html>
