<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e15">
    <title>P2P Workspace Pro</title>
    <script>
        try {
            const savedP2PTheme = localStorage.getItem('p2p_color_theme');
            if (savedP2PTheme) document.documentElement.dataset.theme = savedP2PTheme;
        } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0e15;
            --bg-mid: #1a1a2e;
            --bg-deep: #16213e;
            --bg-accent: #0f3460;
            --surface: rgba(30, 30, 35, 0.68);
            --card-bg: rgba(25, 25, 30, 0.78);
            --primary: #00d2ff;
            --primary-2: #3a7bd5;
            --primary-glow: rgba(0, 210, 255, 0.35);
            --danger: #ff4b4b;
            --text: #ffffff;
            --text-muted: #a9b3c2;
            --border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.3);
            --control-bg: rgba(255, 255, 255, 0.1);
            --control-hover: rgba(255, 255, 255, 0.2);
            --button-text: #07131b;
            --msg-bg: rgba(0, 0, 0, 0.34);
            --chat-input-bg: rgba(0, 0, 0, 0.42);
            --chat-self-start: #0f3460;
            --chat-self-end: #1a1a2e;
            --scroll-thumb: rgba(255, 255, 255, 0.22);
            --menu-bg: rgba(17, 22, 32, 0.96);
        }

        html[data-theme="classic"] {
            color-scheme: dark;
        }
        html[data-theme="light"] {
            color-scheme: light;
            --bg: #edf2f8;
            --bg-mid: #dce7f4;
            --bg-deep: #f8fafc;
            --bg-accent: #d7e5f5;
            --surface: rgba(255, 255, 255, 0.84);
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary: #2864dc;
            --primary-2: #00a6c7;
            --primary-glow: rgba(40, 100, 220, 0.22);
            --text: #182337;
            --text-muted: #5f6b7d;
            --border: rgba(24, 35, 55, 0.14);
            --input-bg: rgba(255, 255, 255, 0.78);
            --control-bg: rgba(24, 35, 55, 0.08);
            --control-hover: rgba(24, 35, 55, 0.14);
            --button-text: #ffffff;
            --msg-bg: rgba(255, 255, 255, 0.78);
            --chat-input-bg: rgba(255, 255, 255, 0.88);
            --chat-self-start: #dceafe;
            --chat-self-end: #dff6fb;
            --scroll-thumb: rgba(24, 35, 55, 0.24);
            --menu-bg: rgba(255, 255, 255, 0.97);
        }
        html[data-theme="green"] {
            --bg: #080f10; --bg-mid: #10201d; --bg-deep: #102e28; --bg-accent: #174c3d;
            --surface: rgba(13, 30, 27, 0.78); --card-bg: rgba(10, 24, 22, 0.88);
            --primary: #51e28c; --primary-2: #b5f36d; --primary-glow: rgba(81, 226, 140, 0.3);
            --border: rgba(130, 231, 177, 0.15); --button-text: #092016;
            --chat-self-start: #164b3a; --chat-self-end: #173629; --menu-bg: rgba(8, 22, 19, 0.97);
        }
        html[data-theme="purple"] {
            --bg: #100b19; --bg-mid: #21132f; --bg-deep: #30204a; --bg-accent: #4a2873;
            --surface: rgba(34, 23, 48, 0.78); --card-bg: rgba(24, 15, 35, 0.88);
            --primary: #bd86ff; --primary-2: #7657e8; --primary-glow: rgba(189, 134, 255, 0.3);
            --border: rgba(204, 175, 255, 0.16); --button-text: #1b1030;
            --chat-self-start: #40245d; --chat-self-end: #2a1a43; --menu-bg: rgba(25, 15, 38, 0.97);
        }
        html[data-theme="ocean"] {
            --bg: #07131b; --bg-mid: #0c2435; --bg-deep: #103b51; --bg-accent: #087e8b;
            --surface: rgba(8, 29, 42, 0.8); --card-bg: rgba(6, 22, 33, 0.9);
            --primary: #42d9d0; --primary-2: #3294da; --primary-glow: rgba(66, 217, 208, 0.3);
            --border: rgba(101, 217, 226, 0.16); --button-text: #062127;
            --chat-self-start: #10495b; --chat-self-end: #123348; --menu-bg: rgba(5, 24, 35, 0.97);
        }
        html[data-theme="sunset"] {
            --bg: #1b1010; --bg-mid: #35201d; --bg-deep: #522b28; --bg-accent: #8a432c;
            --surface: rgba(48, 28, 27, 0.8); --card-bg: rgba(34, 20, 20, 0.9);
            --primary: #ff9c63; --primary-2: #ff5f62; --primary-glow: rgba(255, 140, 86, 0.3);
            --border: rgba(255, 186, 139, 0.16); --button-text: #32150d;
            --chat-self-start: #67352f; --chat-self-end: #40231f; --menu-bg: rgba(33, 19, 19, 0.97);
        }
        html[data-theme="rose"] {
            --bg: #180e19; --bg-mid: #2e172c; --bg-deep: #45203f; --bg-accent: #7d345d;
            --surface: rgba(45, 23, 42, 0.8); --card-bg: rgba(28, 14, 27, 0.9);
            --primary: #ff82ba; --primary-2: #c66bff; --primary-glow: rgba(255, 130, 186, 0.3);
            --border: rgba(255, 166, 211, 0.16); --button-text: #341328;
            --chat-self-start: #632947; --chat-self-end: #3e1e38; --menu-bg: rgba(31, 15, 29, 0.97);
        }
        html[data-theme="amber"] {
            --bg: #17130b; --bg-mid: #2b2414; --bg-deep: #46331a; --bg-accent: #745020;
            --surface: rgba(41, 33, 19, 0.8); --card-bg: rgba(27, 22, 13, 0.9);
            --primary: #ffc857; --primary-2: #f28c28; --primary-glow: rgba(255, 200, 87, 0.28);
            --border: rgba(255, 214, 133, 0.16); --button-text: #2a1b06;
            --chat-self-start: #5a401a; --chat-self-end: #382b17; --menu-bg: rgba(28, 23, 13, 0.97);
        }
        html[data-theme="forest"] {
            --bg: #09140f; --bg-mid: #14261b; --bg-deep: #1b3a29; --bg-accent: #2a5c3b;
            --surface: rgba(19, 39, 27, 0.8); --card-bg: rgba(11, 27, 18, 0.9);
            --primary: #a8e6a1; --primary-2: #49b878; --primary-glow: rgba(120, 221, 145, 0.26);
            --border: rgba(174, 231, 173, 0.16); --button-text: #102718;
            --chat-self-start: #285239; --chat-self-end: #1b3828; --menu-bg: rgba(10, 25, 17, 0.97);
        }
        body { 
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            background: linear-gradient(-45deg, var(--bg), var(--bg-mid), var(--bg-deep), var(--bg-accent));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--input-bg); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        #setup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px; border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
            width: 100%; max-width: 420px;
            text-align: center;
        }
        .setup-card h1 { 
            margin-top: 0; 
            background: -webkit-linear-gradient(45deg, var(--primary), var(--primary-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem; margin-bottom: 5px;
        }
        .setup-card p { color: var(--text-muted); margin-bottom: 25px; }
        
        .input-group { position: relative; margin: 15px 0; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: var(--text-muted); }
        .input-field {
            width: 100%; padding: 14px 14px 14px 45px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text); 
            box-sizing: border-box; font-size: 1rem; transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: var(--input-bg);
        }
        .btn-primary {
            width: 100%; padding: 14px; 
            background: linear-gradient(45deg, var(--primary), var(--primary-2)); 
            color: var(--button-text); border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            margin-top: 15px; font-size: 1.1rem; transition: all 0.3s ease;
            box-shadow: 0 10px 20px var(--primary-glow);
        }
        .btn-primary:hover { box-shadow: 0 10px 25px var(--primary-glow); transform: scale(1.02); }
        .help-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 15px; }

        #main-screen { display: none; flex-direction: column; height: 100%; padding: 15px; box-sizing: border-box; gap: 15px; }
        
        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 16px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .room-info { 
            font-family: monospace; background: var(--input-bg); 
            padding: 6px 12px; border-radius: 8px; color: var(--primary); letter-spacing: 1px;
        }
        .icon-btn {
            background: none; border: none; color: var(--primary); 
            cursor: pointer; padding: 5px; margin-left: 8px; transition: 0.2s;
        }
        .icon-btn:hover { color: var(--text); transform: scale(1.1); }
        
        .workspace { display: flex; flex: 1; gap: 15px; overflow: hidden; }
        
        .video-area { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        .video-grid {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px; overflow-y: auto; align-content: start; padding-right: 5px;
        }
        
        .video-wrapper {
            background: #000; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 16/9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
        }
        .video-wrapper h3 {
            position: absolute; bottom: 12px; left: 12px; margin: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; z-index: 10; border: 1px solid rgba(255,255,255,0.1);
        }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        video.mirror { transform: scaleX(-1); }

        .video-wrapper.fullscreen-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; border-radius: 0; border: none;
        }
        .fullscreen-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            color: white; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px 12px; cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .fullscreen-btn:hover { background: rgba(0,0,0,0.8); }

        .controls-bar {
            padding: 15px; display: flex; justify-content: center; align-items: center; gap: 20px;
            flex-wrap: wrap; flex-shrink: 0;
        }
        
        .control-group {
            display: flex; align-items: center; gap: 12px; 
            background: var(--input-bg); padding: 6px 15px 6px 6px; 
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.05);
        }
        
        .control-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: var(--control-bg); color: var(--text); font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .control-btn:hover { background: var(--control-hover); transform: translateY(-2px); }
        .control-btn.active { background: var(--primary); color: var(--button-text); box-shadow: 0 0 15px var(--primary-glow); }
        .control-btn.danger { background: var(--danger); color: white; }
        .control-btn.danger:hover { background: #ff6b6b; box-shadow: 0 0 15px rgba(255, 75, 75, 0.4); }

        .visualizer { display: flex; gap: 3px; height: 20px; align-items: center; opacity: 0.3; transition: 0.3s; }
        .visualizer.active { opacity: 1; }
        .visualizer .bar { width: 4px; background: var(--primary); border-radius: 2px; height: 4px; transition: height 0.05s ease; }

        input[type=range] { -webkit-appearance: none; background: var(--control-bg); height: 6px; border-radius: 3px; width: 80px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 10px var(--primary-glow); }

        .chat-area { width: 320px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; text-align: center; letter-spacing: 1px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { 
            background: var(--msg-bg); padding: 10px 14px; border-radius: 12px; 
            max-width: 85%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; border: 1px solid rgba(255,255,255,0.05);
        }
        .msg.self { background: linear-gradient(45deg, var(--chat-self-start), var(--chat-self-end)); border-color: var(--primary-glow); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; border-bottom-left-radius: 2px; }
        .sender-name { font-size: 0.75rem; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        
        .chat-input { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--input-bg); }
        .chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--chat-input-bg); color: var(--text); outline: none; transition: 0.2s; }
        .chat-input input:focus { border-color: var(--primary); }
        .chat-input button { background: var(--primary); color: var(--button-text); border: none; width: 45px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .chat-input button:hover { transform: scale(1.05); box-shadow: 0 0 10px var(--primary-glow); }


        .input-field::placeholder, .chat-input input::placeholder { color: var(--text-muted); opacity: 0.82; }
        .input-group i { color: var(--text-muted); }
        .top-bar, .controls-bar { color: var(--text); }
        .theme-trigger {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 34px; min-height: 34px; padding: 8px 10px; margin-left: 8px;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--surface); color: var(--primary); cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }
        .theme-trigger:hover { transform: translateY(-1px); border-color: var(--primary); background: var(--control-hover); }
        .setup-theme-trigger { position: absolute; top: 18px; right: 22px; z-index: 210; margin: 0; padding: 12px; font-size: 1.05rem; }
        .theme-menu {
            display: none; position: fixed; z-index: 10000; width: 278px;
            max-width: calc(100vw - 24px); box-sizing: border-box; padding: 15px;
            background: var(--menu-bg); color: var(--text); border: 1px solid var(--border);
            border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        }
        .theme-menu.open { display: block; animation: themeMenuIn .14s ease-out; }
        @keyframes themeMenuIn { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .theme-menu-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 13px; }
        .theme-menu-title { font-weight: 700; font-size: .95rem; }
        .theme-menu-subtitle { color: var(--text-muted); font-size: .74rem; margin-top: 3px; }
        .theme-current-label { font-size: .72rem; color: var(--primary); text-align: right; max-width: 105px; }
        .theme-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .theme-option {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            min-width: 0; padding: 8px 3px; border: 1px solid transparent; border-radius: 11px;
            background: transparent; color: var(--text-muted); cursor: pointer; font: inherit;
            font-size: .7rem; line-height: 1.2; transition: background .16s ease, border-color .16s ease;
        }
        .theme-option:hover { background: var(--control-hover); color: var(--text); }
        .theme-option.active { border-color: var(--primary); background: var(--primary-glow); color: var(--text); }
        .theme-swatch {
            position: relative; display: block; width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(135deg, var(--swatch-a), var(--swatch-b));
            border: 2px solid rgba(255,255,255,.58); box-shadow: 0 2px 9px rgba(0,0,0,.18), inset 0 0 0 1px rgba(0,0,0,.08);
            flex-shrink: 0;
        }
        .theme-option.active .theme-swatch { outline: 2px solid var(--primary); outline-offset: 2px; }
        .theme-option.active .theme-swatch::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: white; font-size: .8rem; text-shadow: 0 1px 3px rgba(0,0,0,.6);
        }
        .theme-menu-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .72rem; line-height: 1.4; }

        @media (max-width: 950px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .video-area { flex: none; height: auto; min-height: 50vh; overflow: visible; }
            .chat-area { width: 100%; flex: none; height: 400px; }
            .controls-bar { padding: 10px; gap: 10px; }
            .video-grid { padding-right: 0; }
        }
        @media (max-width: 500px) {
            .top-bar { flex-direction: column; gap: 10px; text-align: center; }
            .control-group { padding: 4px 10px 4px 4px; gap: 8px; }
            .control-btn { width: 42px; height: 42px; }
            input[type=range] { width: 60px; }
            .video-grid { grid-template-columns: 1fr; }
        }

        /* Responsive and touch-friendly layout */
        html, body { min-height: 100%; }
        button, input { touch-action: manipulation; }
        button { -webkit-tap-highlight-color: transparent; }

        .video-wrapper.fullscreen-mode {
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            max-height: none;
            aspect-ratio: auto;
            box-sizing: border-box;
            background: #000;
        }

        /* Local preview floating above a maximized remote participant */
        .video-wrapper.pip-preview {
            position: fixed;
            right: max(14px, env(safe-area-inset-right, 0px));
            bottom: max(14px, env(safe-area-inset-bottom, 0px));
            width: clamp(150px, 20vw, 240px);
            height: auto;
            aspect-ratio: 16 / 9;
            z-index: 10001;
            border: 2px solid var(--primary);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.15);
            overflow: hidden;
        }
        .video-wrapper.pip-preview h3 {
            bottom: 6px; left: 6px; padding: 4px 7px; font-size: .72rem;
            max-width: calc(100% - 55px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .video-wrapper.pip-preview .fullscreen-btn {
            top: 5px; right: 5px; min-width: 36px; min-height: 36px;
            padding: 5px; border-radius: 9px;
        }

        @media (max-width: 950px) {
            body { height: 100vh; height: 100dvh; }
            #setup-screen { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; padding: 18px; }
            .setup-card { width: 100%; max-width: 440px; box-sizing: border-box; }
            #main-screen {
                height: 100vh; height: 100dvh; min-height: 0;
                padding: max(8px, env(safe-area-inset-top, 0px)) 8px max(8px, env(safe-area-inset-bottom, 0px));
                gap: 8px;
            }
            .top-bar { padding: 10px 12px; gap: 10px; }
            .workspace {
                flex-direction: column; flex: 1; min-height: 0;
                overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
                gap: 12px; padding-bottom: 2px;
            }
            .video-area { flex: 0 0 auto; width: 100%; min-height: 0; height: auto; overflow: visible; gap: 10px; }
            .video-grid {
                flex: 0 0 auto; display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
                align-content: start; gap: 10px; overflow: visible; padding: 0;
            }
            .video-wrapper { width: 100%; min-width: 0; border-radius: 13px; }
            .controls-bar {
                position: sticky; bottom: 0; z-index: 40;
                padding: 10px; gap: 10px; border-radius: 15px;
                background: var(--menu-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 8px 24px rgba(0,0,0,.22);
            }
            .control-btn { width: 52px; height: 52px; flex: 0 0 auto; }
            .control-group { gap: 8px; }
            .chat-area { width: 100%; flex: 0 0 auto; height: min(42dvh, 370px); min-height: 250px; border-radius: 14px; }
            .chat-header { padding: 13px 12px; }
            .chat-messages { padding: 12px; gap: 10px; }
            .chat-input { padding: 10px; gap: 8px; }
            .chat-input input { min-width: 0; min-height: 46px; font-size: 16px; }
            .chat-input button { width: 50px; min-width: 50px; min-height: 46px; }
            .theme-trigger { min-width: 44px; min-height: 44px; padding: 10px; }
            .theme-menu { max-height: calc(100dvh - 24px); overflow-y: auto; }
            .theme-option { min-height: 66px; font-size: .74rem; }
            .theme-swatch { width: 39px; height: 39px; }
            .icon-btn { min-width: 42px; min-height: 42px; padding: 8px; margin: 0; }
            .room-info { overflow-wrap: anywhere; }
        }

        @media (max-width: 600px) {
            .top-bar {
                display: flex; flex-direction: column; align-items: stretch;
                gap: 5px; padding: 7px 10px; text-align: left; border-radius: 13px;
            }
            .top-bar > div { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; }
            .top-bar > div:first-child { justify-content: flex-start; }
            .top-bar > div:last-child { justify-content: flex-start; }
            #ui-username { overflow-wrap: anywhere; }
            .room-info { font-size: .9rem; padding: 6px 9px; }
            .video-grid { grid-template-columns: 1fr; gap: 9px; }
            .video-wrapper { aspect-ratio: 16 / 9; border-radius: 12px; }
            .video-wrapper h3 { left: 8px; bottom: 8px; padding: 7px 9px; font-size: .8rem; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .fullscreen-btn { top: 7px; right: 7px; min-width: 44px; min-height: 44px; padding: 10px; border-radius: 10px; }
            .controls-bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 9px; }
            .controls-bar > .control-group { justify-content: center; min-width: 0; padding: 0; background: transparent; border: 0; }
            .controls-bar > .control-group:first-child { grid-column: auto; }
            .controls-bar > .control-group:first-child .visualizer { display: none; }
            .controls-bar > #btn-cam, .controls-bar > #btn-screen { justify-self: center; }
            .controls-bar > .volume-control-group {
                grid-column: 1 / -1; justify-content: center; gap: 12px;
                padding: 5px 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px;
            }
            #volume-slider { width: min(44vw, 170px); }
            .control-btn { width: 54px; height: 54px; font-size: 1.15rem; }
            .chat-area { height: 42dvh; min-height: 245px; }
            .msg { max-width: 92%; font-size: 1rem; }
            .theme-menu { width: min(330px, calc(100vw - 20px)); max-width: calc(100vw - 20px); padding: 13px; }
            .theme-options { gap: 6px; }
            .setup-card { padding: 30px 20px; border-radius: 18px; }
            .setup-card h1 { font-size: 1.9rem; }
            .input-field { min-height: 50px; font-size: 16px; }
            .btn-primary { min-height: 52px; }
            .setup-theme-trigger { top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
            .video-wrapper.pip-preview {
                right: max(10px, env(safe-area-inset-right, 0px));
                bottom: max(10px, env(safe-area-inset-bottom, 0px));
                width: clamp(112px, 31vw, 165px);
                border-radius: 11px;
            }
            .video-wrapper.pip-preview h3 { left: 5px; bottom: 5px; padding: 3px 5px; font-size: .65rem; }
            .video-wrapper.pip-preview .fullscreen-btn { min-width: 36px; min-height: 36px; padding: 5px; }
        }

        @media (max-width: 360px) {
            #main-screen { padding-left: 5px; padding-right: 5px; }
            .top-bar { padding: 6px 8px; }

            .chat-input { padding: 8px; }

        @media (orientation: landscape) and (max-height: 500px) and (max-width: 950px) {
            #main-screen { padding-top: max(5px, env(safe-area-inset-top, 0px)); padding-bottom: max(5px, env(safe-area-inset-bottom, 0px)); }
            .top-bar { flex-direction: row; flex-wrap: wrap; padding: 5px 9px; }
            .video-grid { grid-template-columns: repeat(auto-fit, minmax(min(48%, 250px), 1fr)); }
            .video-wrapper { max-height: 44vh; }
            .controls-bar { padding: 6px 9px; }
            .control-btn { width: 44px; height: 44px; }
            .chat-area { height: 45dvh; min-height: 180px; }
        }
    </style>
</head>
<body>
    <div class="theme-menu" id="theme-menu" role="dialog" aria-label="Выбор цветовой темы">
        <div class="theme-menu-heading">
            <div>
                <div class="theme-menu-title">Цветовая тема</div>
                <div class="theme-menu-subtitle">Настройте оформление</div>
            </div>
            <div class="theme-current-label" id="theme-current-label">Классическая</div>
        </div>
        <div class="theme-options">
            <button type="button" class="theme-option" data-theme="classic" onclick="applyTheme('classic')" aria-label="Классическая тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#00d2ff;--swatch-b:#3a7bd5"></span><span>Классика</span></button>
            <button type="button" class="theme-option" data-theme="light" onclick="applyTheme('light')" aria-label="Светлая тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#ffffff;--swatch-b:#b8d2f4"></span><span>Светлая</span></button>
            <button type="button" class="theme-option" data-theme="green" onclick="applyTheme('green')" aria-label="Тёмная тема с зелёными кнопками" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#51e28c;--swatch-b:#10201d"></span><span>Зелёная</span></button>
            <button type="button" class="theme-option" data-theme="purple" onclick="applyTheme('purple')" aria-label="Фиолетовая тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#bd86ff;--swatch-b:#30204a"></span><span>Фиолетовая</span></button>
            <button type="button" class="theme-option" data-theme="ocean" onclick="applyTheme('ocean')" aria-label="Океанская тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#42d9d0;--swatch-b:#103b51"></span><span>Океан</span></button>
            <button type="button" class="theme-option" data-theme="sunset" onclick="applyTheme('sunset')" aria-label="Тема заката" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#ff9c63;--swatch-b:#522b28"></span><span>Закат</span></button>
            <button type="button" class="theme-option" data-theme="rose" onclick="applyTheme('rose')" aria-label="Розовая тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#ff82ba;--swatch-b:#45203f"></span><span>Розовая</span></button>
            <button type="button" class="theme-option" data-theme="amber" onclick="applyTheme('amber')" aria-label="Янтарная тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#ffc857;--swatch-b:#46331a"></span><span>Янтарная</span></button>
            <button type="button" class="theme-option" data-theme="forest" onclick="applyTheme('forest')" aria-label="Лесная тема" aria-pressed="false"><span class="theme-swatch" style="--swatch-a:#a8e6a1;--swatch-b:#1b3a29"></span><span>Лес</span></button>
        </div>
        <div class="theme-menu-footer">Выбранная тема сохраняется на этом устройстве.</div>
    </div>

    <div id="setup-screen">
        <button type="button" class="theme-trigger setup-theme-trigger" onclick="toggleThemeMenu(event)" title="Цветовая тема" aria-label="Открыть выбор цветовой темы"><i class="fas fa-palette"></i></button>
        <div class="setup-card">
            <h1><i class="fas fa-satellite-dish"></i> P2P Pro</h1>
            <p>Децентрализованная сеть</p>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="input-field" placeholder="Как вас зовут?">
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="room-id" class="input-field" placeholder="Код комнаты (пусто = новая)">
            </div>
            
            <button class="btn-primary" onclick="joinRoom()">
                <i class="fas fa-sign-in-alt"></i> Войти в эфир
            </button>
            <div class="help-text">Комната живет, пока в ней есть участники.</div>
        </div>
    </div>
    
    <div id="main-screen">
        <div class="top-bar glass-panel">
            <div>
                <i class="fas fa-user-circle" style="color:var(--primary); margin-right:5px;"></i>
                <strong id="ui-username"></strong>
                <button class="icon-btn" onclick="changeName()" title="Изменить имя">
                    <i class="fas fa-pen"></i>
                </button>
            </div>
            <div>
                <span style="color:var(--text-muted); font-size: 0.9rem;">Комната:</span> 
                <span class="room-info" id="ui-room-id">Загрузка...</span>
                <button class="icon-btn" onclick="copyInviteLink()" title="Скопировать ссылку">
                    <i class="fas fa-copy"></i>
                </button>
                <button type="button" class="theme-trigger" onclick="toggleThemeMenu(event)" title="Цветовая тема" aria-label="Открыть выбор цветовой темы"><i class="fas fa-palette"></i></button>
            </div>
        </div>
        
        <div class="workspace">
            <div class="video-area">
                <div class="video-grid" id="video-grid">
                    <div class="video-wrapper local-video-wrapper">
                        <h3 id="local-video-title">Вы</h3>
                        <button class="fullscreen-btn" onclick="toggleVideoFullscreen(this)" title="Развернуть видео" aria-label="Развернуть своё видео">
                            <i class="fas fa-expand"></i>
                        </button>
                        <video id="local-video" autoplay muted playsinline class="mirror"></video>
                    </div>
                </div>
                
                <div class="controls-bar glass-panel">
                    <div class="control-group">
                        <button class="control-btn danger" id="btn-mic" onclick="toggleMic()" title="Микрофон">
                            <i class="fas fa-microphone-slash"></i>
                        </button>
                        <div class="visualizer" id="audio-visualizer">
                            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        </div>
                    </div>
                    
                    <button class="control-btn danger" id="btn-cam" onclick="toggleCam()" title="Камера">
                        <i class="fas fa-video-slash"></i>
                    </button>
                    
                    <button class="control-btn" id="btn-screen" onclick="toggleScreen()" title="Демонстрация экрана (доступность зависит от браузера)">
                        <i class="fas fa-desktop"></i>
                    </button>

                    <div class="control-group volume-control-group">
                        <button class="control-btn active" id="btn-volume" onclick="toggleMute()" title="Входящий звук">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
                    </div>
                </div>
            </div>
            
            <div class="chat-area glass-panel">
                <div class="chat-header"><i class="far fa-comments"></i> Чат</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Написать..." onkeypress="if(event.key === 'Enter') sendChat()">
                    <button onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>

        const P2P_THEMES = {
            classic: 'Классическая', light: 'Светлая', green: 'Тёмная + зелёный',
            purple: 'Фиолетовая', ocean: 'Океан', sunset: 'Закат', rose: 'Розовая',
            amber: 'Янтарная', forest: 'Лесная'
        };

        function applyTheme(themeName) {
            if (!Object.prototype.hasOwnProperty.call(P2P_THEMES, themeName)) themeName = 'classic';
            document.documentElement.dataset.theme = themeName;
            try { localStorage.setItem('p2p_color_theme', themeName); } catch (e) {}
            document.querySelectorAll('.theme-option').forEach(option => {
                const selected = option.dataset.theme === themeName;
                option.classList.toggle('active', selected);
                option.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
            const label = document.getElementById('theme-current-label');
            if (label) label.textContent = P2P_THEMES[themeName];
            closeThemeMenu();
        }

        function toggleThemeMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('theme-menu');
            const trigger = event && event.currentTarget;
            if (!menu || !trigger) return;
            const shouldOpen = !menu.classList.contains('open');
            if (!shouldOpen) {
                closeThemeMenu();
                return;
            }
            menu.classList.add('open');
            const rect = trigger.getBoundingClientRect();
            const menuWidth = Math.min(278, window.innerWidth - 24);
            const menuHeight = menu.offsetHeight;
            const left = Math.max(12, Math.min(window.innerWidth - menuWidth - 12, rect.right - menuWidth));
            let top = rect.bottom + 8;
            if (top + menuHeight > window.innerHeight - 12) top = Math.max(12, rect.top - menuHeight - 8);
            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
        }

        function closeThemeMenu() {
            const menu = document.getElementById('theme-menu');
            if (menu) menu.classList.remove('open');
        }

        document.addEventListener('click', (event) => {
            const menu = document.getElementById('theme-menu');
            if (menu && !menu.contains(event.target) && !event.target.closest('.theme-trigger')) closeThemeMenu();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeThemeMenu();
                exitVideoFullscreen();
            }
        });
        window.addEventListener('resize', closeThemeMenu);
        applyTheme(document.documentElement.dataset.theme || 'classic');

        function updateFullscreenButtons() {
            document.querySelectorAll('.video-wrapper').forEach(wrapper => {
                const button = wrapper.querySelector('.fullscreen-btn');
                if (!button) return;
                const isFullscreen = wrapper.classList.contains('fullscreen-mode');
                button.innerHTML = isFullscreen
                    ? '<i class="fas fa-compress"></i>'
                    : '<i class="fas fa-expand"></i>';
                button.title = isFullscreen ? 'Свернуть видео' : 'Развернуть видео';
                button.setAttribute('aria-label', isFullscreen ? 'Свернуть видео' : 'Развернуть видео');
            });
        }

        function exitVideoFullscreen() {
            document.querySelectorAll('.video-wrapper.fullscreen-mode').forEach(wrapper => {
                wrapper.classList.remove('fullscreen-mode');
            });
            document.querySelectorAll('.video-wrapper.pip-preview').forEach(wrapper => {
                wrapper.classList.remove('pip-preview');
            });
            updateFullscreenButtons();
        }

        function toggleVideoFullscreen(button) {
            const wrapper = button && button.closest('.video-wrapper');
            if (!wrapper) return;

            if (wrapper.classList.contains('fullscreen-mode')) {
                exitVideoFullscreen();
                return;
            }

            // Only one tile can be maximized at a time.
            exitVideoFullscreen();
            wrapper.classList.add('fullscreen-mode');

            // When somebody else's tile is maximized, keep the local camera/screen visible.
            const localPreview = document.querySelector('.local-video-wrapper');
            if (localPreview && wrapper !== localPreview) {
                localPreview.classList.add('pip-preview');
            }
            updateFullscreenButtons();
        }

        let myPeerId = localStorage.getItem('my_p2p_id');
        if (!myPeerId) {
            myPeerId = 'user_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('my_p2p_id', myPeerId);
        }

        const peer = new Peer(myPeerId, {
            host: 'belo4nik-server.duckdns.org',
            secure: true,
            port: 443,
            path: '/myapp',
            config: {
                'iceServers': [
                    { urls: 'stun:belo4nik-server.duckdns.org:3478' },
                    {
                        urls: [
                            'turn:belo4nik-server.duckdns.org:3478',
                            'turn:belo4nik-server.duckdns.org:3478?transport=tcp'
                        ],
                        username: 'myuser', 
                        credential: 'ad2tmi6e'
                    }
                ]
            }
        });
        
        let myName = localStorage.getItem('my_p2p_name') || "";
        let currentRoomId = null;
        let localStream = null;
        let screenStream = null;
        let micEnabled = false;
        let camEnabled = false;
        let isScreenSharing = false;
        const peers = {};

        let globalVolume = 1;
        let isMuted = false;
        let audioCtx, analyser, dataArray;
        let uiAudioContext = null;
        let lastUiSoundAt = 0;
        let wakeLock = null;

        if (myName) document.getElementById('username').value = myName;

        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) document.getElementById('room-id').value = roomFromUrl;

        peer.on('disconnected', () => {
            addSysMsg('Потеряна связь с сервером сигналов. Восстанавливаем...');
            peer.reconnect();
        });

        peer.on('error', (err) => {
            console.error('PeerJS Ошибка:', err);
            if (err.type === 'peer-unavailable') addSysMsg('Ошибка: Участник недоступен.');
        });

        function changeVolume(val) {
            globalVolume = parseFloat(val);
            isMuted = globalVolume === 0;
            updateVolumeUI();
            applyVolumeToAll();
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                document.getElementById('volume-slider').value = 0;
            } else {
                if (globalVolume === 0) globalVolume = 1;
                document.getElementById('volume-slider').value = globalVolume;
            }
            updateVolumeUI();
            applyVolumeToAll();
        }

        function updateVolumeUI() {
            const btn = document.getElementById('btn-volume');
            if (isMuted || globalVolume === 0) {
                btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                btn.className = 'control-btn danger';
            } else {
                btn.innerHTML = globalVolume < 0.5 ? '<i class="fas fa-volume-down"></i>' : '<i class="fas fa-volume-up"></i>';
                btn.className = 'control-btn active';
            }
        }

        function applyVolumeToAll() {
            const actualVol = isMuted ? 0 : globalVolume;
            Object.values(peers).forEach(p => {
                if (p.videoWrapper) {
                    const vid = p.videoWrapper.querySelector('video');
                    if (vid) vid.volume = actualVol;
                }
            });
        }

        function playUiSound(kind = 'click') {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!uiAudioContext) uiAudioContext = new AudioContextClass();
                if (uiAudioContext.state === 'suspended') uiAudioContext.resume().catch(() => {});
                if (kind === 'click' && Date.now() - lastUiSoundAt < 45) return;
                lastUiSoundAt = Date.now();
                const now = uiAudioContext.currentTime;
                const oscillator = uiAudioContext.createOscillator();
                const gain = uiAudioContext.createGain();
                oscillator.connect(gain);
                gain.connect(uiAudioContext.destination);
                const isMessage = kind === 'message';
                const duration = isMessage ? 0.14 : 0.055;
                oscillator.type = isMessage ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(isMessage ? 880 : 620, now);
                oscillator.frequency.exponentialRampToValueAtTime(isMessage ? 1175 : 480, now + duration);
                
                const targetGain = isMessage ? 0.04 : 0.02;
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(targetGain, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                oscillator.start(now);
                oscillator.stop(now + duration + 0.01);
            } catch (err) {}
        }

        document.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button || button.disabled || button.matches('.chat-input button')) return;
            playUiSound('click');
        });

        function createDummyVideoTrack() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const stream = canvas.captureStream(1); 
            const track = stream.getVideoTracks()[0];
            track.enabled = false;
            return track;
        }

        function getActiveStream() {
            if (isScreenSharing && screenStream) {
                return new MediaStream([
                    ...localStream.getAudioTracks(),
                    ...screenStream.getVideoTracks()
                ]);
            }
            return localStream;
        }

        async function initMedia() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) {}

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
                try {
                    const videoStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                    videoStream.getVideoTracks().forEach(track => {
                        track.enabled = false;
                        localStream.addTrack(track);
                    });
                } catch (cameraError) {
                    console.warn("Камера недоступна, используем видео-заглушку для стабильности WebRTC");
                    localStream.addTrack(createDummyVideoTrack());
                }

                document.getElementById('local-video').srcObject = localStream;
                initVisualizer(localStream);
                return true;
            } catch (err) {
                alert(`Не удалось получить микрофон: ${err.message}`);
                return false;
            }
        }

        function initVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bars = document.querySelectorAll('.visualizer .bar');
            if (!micEnabled) {
                bars.forEach(bar => bar.style.height = '4px');
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            const step = Math.floor(dataArray.length / 10);
            for (let i = 0; i < 5; i++) {
                const value = dataArray[i * step];
                bars[i].style.height = Math.max(4, (value / 255) * 20) + 'px';
            }
        }

        async function joinRoom() {
            const nameInput = document.getElementById('username').value.trim();
            let roomInput = document.getElementById('room-id').value.trim();
            if (!nameInput) return alert('Пожалуйста, введите ваше имя!');
            
            myName = nameInput;
            localStorage.setItem('my_p2p_name', myName); 
            
            if (!(await initMedia())) return;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('ui-username').innerText = myName;

            currentRoomId = roomInput || Math.random().toString(36).substr(2, 6);
            document.getElementById('ui-room-id').innerText = currentRoomId;
            window.history.replaceState({}, document.title, window.location.pathname + '?room=' + currentRoomId);
            
            addSysMsg(roomInput ? 'Подключение к комнате...' : 'Комната создана!');

            try {
                const response = await fetch(`https://belo4nik-server.duckdns.org/myapp/api/room/${currentRoomId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peerId: myPeerId })
                });
                const data = await response.json();
                
                if (data.peers && data.peers.length > 0) {
                    addSysMsg(`В комнате уже есть участники. Соединяемся...`);
                    data.peers.forEach(targetId => {
                        connectToPeer(targetId, "Ожидание...");
                    });
                } else {
                    addSysMsg('Вы первый в этой комнате. Отправьте ссылку коллегам!');
                }
            } catch (err) {
                console.error("Ошибка API комнат:", err);
                addSysMsg('⚠️ Ошибка синхронизации с сервером комнат.');
            }
        }

        function changeName() {
            const newName = prompt("Введите новое имя:", myName);
            if (newName && newName.trim() !== "" && newName !== myName) {
                myName = newName.trim();
                localStorage.setItem('my_p2p_name', myName);
                document.getElementById('ui-username').innerText = myName;
                Object.values(peers).forEach(p => {
                    if (p.conn && p.conn.open) p.conn.send({ type: 'name_change', name: myName });
                });
                addSysMsg(`Имя изменено на ${myName}.`);
            }
        }

        peer.on('connection', (conn) => {
            const remoteName = conn.metadata?.name || 'Аноним';
            const id = conn.peer;
            if (peers[id]) removePeer(id);

            conn.on('open', () => {
                setupConnectionData(conn, remoteName);
                conn.send({ type: 'name_change', name: myName });
            });
        });

        function connectToPeer(targetId, targetName = "Ожидание...") {
            if (targetId === peer.id) return; 
            if (peers[targetId] && peers[targetId].conn && peers[targetId].conn.open) return;

            const conn = peer.connect(targetId, { metadata: { name: myName } });
            if (localStream) {
                const call = peer.call(targetId, getActiveStream(), { metadata: { name: myName } });
                handleCall(call, targetName);
            }
            conn.on('open', () => { 
                setupConnectionData(conn, targetName); 
            });
        }

        function setupConnectionData(conn, remoteName) {
            const id = conn.peer;
            if (!peers[id]) peers[id] = { name: remoteName };
            peers[id].conn = conn;
            peers[id].name = remoteName;
            
            addSysMsg(`${remoteName} на связи.`);

            conn.peerConnection.addEventListener('iceconnectionstatechange', () => {
                const state = conn.peerConnection.iceConnectionState;
                if (state === 'connected') addSysMsg(`✅ P2P с ${peers[id].name} установлен`);
                if (state === 'failed') addSysMsg(`❌ Связь с ${peers[id].name} потеряна`);
            });

            conn.on('data', (data) => {
                if (typeof data === 'object') {
                    if (data.type === 'name_change') {
                        const oldName = peers[id].name;
                        peers[id].name = data.name;
                        if (peers[id].videoWrapper) {
                            peers[id].videoWrapper.querySelector('h3').innerText = data.name;
                        }
                        if (oldName !== "Ожидание...") addSysMsg(`${oldName} теперь ${data.name}.`);
                    }
                } else {
                    addChatMsg(peers[id].name, data, 'other');
                }
            });

            conn.on('close', () => removePeer(id));
            conn.on('error', () => removePeer(id));
        }

        peer.on('call', (call) => {
            const remoteName = call.metadata?.name || 'Аноним';
            const id = call.peer;
            if (peers[id] && peers[id].call) {
                if (peers[id].videoWrapper) peers[id].videoWrapper.remove();
            }
            call.answer(getActiveStream());
            handleCall(call, remoteName);
        });

        function handleCall(call, name) {
            const id = call.peer;
            if (!peers[id]) peers[id] = { name: name };
            peers[id].call = call;
            
            call.on('stream', (remoteStream) => {
                if (peers[id].videoWrapper) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';
                wrapper.innerHTML = `
                    <h3>${peers[id].name}</h3>
                    <button class="fullscreen-btn" onclick="toggleVideoFullscreen(this)" title="Развернуть видео" aria-label="Развернуть видео участника">
                        <i class="fas fa-expand"></i>
                    </button>
                    <video playsinline></video>
                `;
                
                const videoEl = wrapper.querySelector('video');
                videoEl.srcObject = remoteStream;
                videoEl.volume = isMuted ? 0 : globalVolume;

                document.getElementById('video-grid').appendChild(wrapper);
                peers[id].videoWrapper = wrapper;

                videoEl.play().catch(e => console.log("Автоплей заблокирован", e));
            });

            call.on('close', () => removePeer(id));
            call.on('error', () => removePeer(id));
        }

        function removePeer(id) {
            const p = peers[id];
            if (!p) return;

            if (p.videoWrapper && p.videoWrapper.classList.contains('fullscreen-mode')) exitVideoFullscreen();
            if (p.videoWrapper) p.videoWrapper.remove();
            if (p.conn) p.conn.close();
            if (p.call) p.call.close();
            
            const participantName = p.name || 'Участник';
            addSysMsg(`${participantName} отключился.`);
            
            delete peers[id];
        }

        function toggleMic() {
            micEnabled = !micEnabled;
            localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
            const btn = document.getElementById('btn-mic');
            const vis = document.getElementById('audio-visualizer');
            
            btn.className = micEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = micEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
            
            if (micEnabled) {
                vis.classList.add('active');
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                vis.classList.remove('active');
            }
        }

        function toggleCam() {
            camEnabled = !camEnabled;
            localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
            const btn = document.getElementById('btn-cam');
            btn.className = camEnabled ? 'control-btn active' : 'control-btn danger';
            btn.innerHTML = camEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        async function toggleScreen() {
            const btn = document.getElementById('btn-screen');
            if (!isScreenSharing) {
                if (!navigator.mediaDevices || typeof navigator.mediaDevices.getDisplayMedia !== 'function') {
                    addSysMsg('Этот браузер не поддерживает демонстрацию экрана. Попробуйте открыть сервис в браузере, который предоставляет захват экрана.');
                    return;
                }
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    
                    Object.values(peers).forEach(p => {
                        if (p.call && p.call.peerConnection) {
                            const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) sender.replaceTrack(screenTrack);
                        }
                    });
                    
                    const localVideo = document.getElementById('local-video');
                    localVideo.srcObject = screenStream;
                    localVideo.classList.remove('mirror');
                    
                    isScreenSharing = true;
                    btn.classList.add('active');
                    screenTrack.onended = stopScreenSharing;
                } catch (e) { 
                    console.error("Ошибка экрана", e);
                    addSysMsg(`Не удалось начать демонстрацию экрана: ${e && e.message ? e.message : 'операция отменена или недоступна'}.`);
                }
            } else { 
                stopScreenSharing(); 
            }
        }

        function stopScreenSharing() {
            if (!isScreenSharing) return;
            
            const camTrack = localStream.getVideoTracks()[0];
            
            Object.values(peers).forEach(p => {
                if (p.call && p.call.peerConnection) {
                    const sender = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender && camTrack) {
                        sender.replaceTrack(camTrack);
                    }
                }
            });
            
            const localVideo = document.getElementById('local-video');
            localVideo.srcObject = localStream;
            localVideo.classList.add('mirror');
            
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            
            isScreenSharing = false;
            document.getElementById('btn-screen').classList.remove('active');
        }

        function sendChat() {
            playUiSound('click');
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            Object.values(peers).forEach(p => {
                if (p.conn && p.conn.open) p.conn.send(msg);
            });
            addChatMsg(myName, msg, 'self');
            input.value = '';
        }

        function addChatMsg(sender, msg, type) {
            if (type === 'other') playUiSound('message');
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="msg ${type}">${type === 'other' ? `<div class="sender-name">${sender}</div>` : ''}${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function addSysMsg(msg) {
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div style="text-align:center; color:rgba(255,255,255,0.4); font-size:0.8rem; margin:5px 0;">${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function copyInviteLink() {
            const url = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
            navigator.clipboard.writeText(url);
            addSysMsg("Ссылка скопирована!");
        }
    </script>
</body>
</html>
